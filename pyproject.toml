[project]
name = "contacts"
version = "0.1.0"
description = "Contacts API — OpenAlex search graph"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.vercel]
entrypoint = "app.main:app"
